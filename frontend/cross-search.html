<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cross-Mapping Search</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: linear-gradient(120deg, #e0e7ff 0%, #f0fdf4 100%); }
        .container {
            max-width: 700px;
            margin: 48px auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.12);
            padding: 40px 32px 32px 32px;
        }
        h1 {
            color: var(--primary);
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            letter-spacing: -1px;
        }
        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
        }
        .search-bar input {
            flex: 1;
            padding: 0.85rem 1rem;
            font-size: 1.1rem;
            border-radius: 8px;
            border: 1.5px solid var(--gray-light);
            background: #f8fafc;
            transition: border 0.2s;
        }
        .search-bar input:focus {
            border: 1.5px solid var(--primary);
            background: #fff;
        }
        .search-bar button {
            padding: 0.85rem 2rem;
            font-size: 1.1rem;
            border-radius: 8px;
            border: none;
            background: var(--primary);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 2px 8px #2563eb22;
            transition: background 0.2s, box-shadow 0.2s;
        }
        .search-bar button:hover {
            background: var(--primary-dark);
            box-shadow: 0 4px 16px #2563eb33;
        }
        .results {
            margin-top: 32px;
        }
        .bundle-entry {
            background: #f1f5f9;
            border-radius: 10px;
            margin-bottom: 22px;
            padding: 20px 18px 16px 18px;
            box-shadow: 0 2px 8px #0001;
            border-left: 5px solid var(--primary);
            transition: box-shadow 0.2s;
        }
        .bundle-entry:hover {
            box-shadow: 0 8px 24px #2563eb22;
        }
        .coding-group {
            margin-bottom: 10px;
        }
        .coding-item {
            margin-left: 18px;
            font-size: 1.05em;
            padding: 2px 0;
        }
        .label {
            font-weight: bold;
            color: var(--primary);
            font-size: 1.08em;
        }
        .no-results {
            color: var(--danger);
            margin-top: 20px;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cross-Mapping Search</h1>
        <form id="cross-search-form" class="search-bar" onsubmit="return false;">
            <input type="text" id="cross-search-query" placeholder="Enter NAMASTE name, ICD-11 code, or TM2 code" required>
            <button type="submit">Search</button>
        </form>
        <div id="cross-search-results" class="results"></div>
    </div>
    <script src="cross-search.js"></script>
</body>
</html>
